<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy (tâche 0.7) : livrée par EN-TÊTES HTTP
      uniquement (plugin Vite dans vite.config.ts, pour dev et preview ;
      le futur serveur de production doit appliquer exactement les mêmes
      en-têtes — aucune divergence preview/prod). La <meta> CSP est
      RETIRÉE : elle ne couvrait ni frame-ancestors, ni les ressources
      chargées avant elle, et elle était figée dans le HTML au build.
      Deux sources de vérité (meta + en-têtes) divergeraient.
      Politique exacte :
        Content-Security-Policy: default-src 'self'; script-src 'self';
          style-src 'self'; img-src 'self'; font-src 'self';
          connect-src 'self'; object-src 'none'; base-uri 'none';
          form-action 'self'; frame-ancestors 'none'
        X-Frame-Options: DENY
        Cache-Control: no-cache (sur /, /index.html, /manifest.webmanifest
          et /sw.js — sinon un correctif met jusqu'à 24 h à atteindre les
          utilisateurs derrière le cache HTTP)
      Aucun 'unsafe-inline', aucun 'unsafe-eval'. Politique nonce/hash :
      rien d'inline, point. worker-src : intentionnellement implicite
      (retombe sur default-src 'self'). report-to : à ajouter en prod
      quand un endpoint existera. style-src : <style> et
      el.setAttribute('style', …) bloqués ; el.style.prop = …
      autorisé (API DOM, hors CSP). Le service worker est hors CSP
      page : toute requête réseau depuis le SW doit être auditée
      séparément.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Application</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
